name: Readwise Export
type: filesystem
mount: esper/raw/readwise
format: readwise-markdown
# Readwise export contains two subdirectories:
#   Articles/ — web articles (includes Instapaper highlights, supersedes instapaper source)
#   Books/ — Kindle/book highlights (supersedes kindle source)
# Each file is one source unit (one article or one book).
# Format: # Title, ### Metadata (Author, Full Title, Category #articles/#books,
#   optional URL, optional Document Tags), ### Highlights (bulleted list).
# Articles have Instapaper or Readwise highlight links; books have Kindle location links.
# Some highlights have **Tags:** lines (e.g. #favorite).
cursor:
  last_processed: null
  files_processed: []
